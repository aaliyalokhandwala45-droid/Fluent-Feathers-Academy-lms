<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Challenge Entry | Fluent Feathers Academy</title>
  <style>
    :root {
      --ink: #17313b;
      --muted: #64748b;
      --brand: #0f766e;
      --brand-2: #f97316;
      --paper: #fffaf1;
      --line: rgba(23, 49, 59, 0.14);
      --danger: #dc2626;
      --success: #047857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(249, 115, 22, 0.20), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(15, 118, 110, 0.22), transparent 30%),
        linear-gradient(135deg, #fff7ed 0%, #ecfeff 100%);
      padding: 28px 16px;
    }

    .shell {
      width: min(940px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 22px;
      align-items: stretch;
    }

    .hero, .card {
      background: rgba(255, 250, 241, 0.90);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(14px);
    }

    .hero {
      padding: 34px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -80px;
      bottom: -70px;
      border-radius: 46% 54% 58% 42%;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.18), rgba(15, 118, 110, 0.22));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.10);
      color: var(--brand);
      font: 800 0.78rem/1.2 Verdana, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(2.1rem, 5vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .description {
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.65;
      margin: 0 0 18px;
      white-space: pre-wrap;
    }

    .meta {
      display: grid;
      gap: 9px;
      margin-top: 22px;
      position: relative;
      z-index: 1;
    }

    .pill {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--line);
      font-family: Verdana, sans-serif;
      font-size: 0.88rem;
    }

    .pill strong { color: var(--brand); }

    .card {
      padding: 28px;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 1.8rem;
      letter-spacing: -0.035em;
    }

    .hint {
      margin: 0 0 22px;
      color: var(--muted);
      font-family: Verdana, sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 15px;
    }

    label {
      display: grid;
      gap: 7px;
      font-family: Verdana, sans-serif;
      font-weight: 800;
      font-size: 0.84rem;
      color: #334155;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 13px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);
      font: 500 1rem/1.2 Verdana, sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(15, 118, 110, 0.58);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }

    input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 15px 18px;
      color: white;
      background: linear-gradient(135deg, var(--brand), #115e59);
      font: 900 1rem/1 Verdana, sans-serif;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(15, 118, 110, 0.25);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      box-shadow: none;
    }

    .message {
      display: none;
      padding: 13px 14px;
      border-radius: 15px;
      font-family: Verdana, sans-serif;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    .loading {
      width: min(560px, 100%);
      margin: 15vh auto;
      text-align: center;
      background: rgba(255, 250, 241, 0.92);
      border-radius: 24px;
      padding: 32px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.14);
    }

    @media (max-width: 780px) {
      body { padding: 16px; }
      .shell { grid-template-columns: 1fr; }
      .hero, .card { border-radius: 22px; padding: 24px; }
      .pill { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main id="app" class="loading">Loading challenge...</main>

  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const challengeId = params.get('id');

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(value) {
      if (!value) return '-';
      return new Date(value).toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function setMessage(type, text) {
      const message = document.getElementById('message');
      message.className = `message ${type}`;
      message.textContent = text;
    }

    async function loadChallenge() {
      if (!challengeId) {
        app.className = 'loading';
        app.textContent = 'Challenge link is missing. Please use the link shared by Fluent Feathers Academy.';
        return;
      }

      try {
        const res = await fetch(`/api/public-challenges/${encodeURIComponent(challengeId)}`);
        const challenge = await res.json();
        if (!res.ok) throw new Error(challenge.error || 'Challenge not found');

        app.className = 'shell';
        app.innerHTML = `
          <section class="hero">
            <span class="eyebrow">Public Challenge Entry</span>
            <h1>${escapeHtml(challenge.title)}</h1>
            <p class="description">${escapeHtml(challenge.description || 'Record your child completing this challenge and submit the video here.')}</p>
            <div class="meta">
              <div class="pill"><span>Challenge Type</span><strong>${escapeHtml(challenge.challenge_type || 'General')}</strong></div>
              <div class="pill"><span>Dates</span><strong>${formatDate(challenge.week_start)} - ${formatDate(challenge.week_end)}</strong></div>
              <div class="pill"><span>Badge</span><strong>${escapeHtml(challenge.badge_reward || 'Challenge Champion')}</strong></div>
            </div>
          </section>

          <section class="card">
            <h2>Submit Your Video</h2>
            <p class="hint">Parents can submit entries here even if the child is not already a Fluent Feathers LMS student. Upload one video file, maximum 100MB.</p>
            <div id="message" class="message"></div>
            <form id="entryForm">
              <input name="uploadType" type="hidden" value="homework">
              <label>
                Child Name *
                <input name="child_name" type="text" maxlength="120" required placeholder="Child's full name">
              </label>
              <label>
                Parent Name *
                <input name="parent_name" type="text" maxlength="120" required placeholder="Parent's full name">
              </label>
              <label>
                Child Age *
                <input name="child_age" type="number" min="1" max="18" required placeholder="Age">
              </label>
              <label>
                Parent Email *
                <input name="parent_email" type="email" maxlength="180" required placeholder="parent@example.com">
              </label>
              <label>
                Challenge Video *
                <input name="video" type="file" accept="video/*" required>
              </label>
              <button id="submitBtn" type="submit">Submit Entry</button>
            </form>
          </section>
        `;

        document.getElementById('entryForm').addEventListener('submit', submitEntry);
      } catch (err) {
        app.className = 'loading';
        app.innerHTML = `<strong>Unable to load challenge.</strong><br>${escapeHtml(err.message)}`;
      }
    }

    async function submitEntry(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const submitBtn = document.getElementById('submitBtn');
      const video = form.video.files[0];

      if (!video) {
        setMessage('error', 'Please select a challenge video.');
        return;
      }

      if (!video.type.startsWith('video/')) {
        setMessage('error', 'Please upload a video file only.');
        return;
      }

      if (video.size > 100 * 1024 * 1024) {
        setMessage('error', 'Video is too large. Please upload a file below 100MB.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';
      setMessage('', '');

      try {
        const formData = new FormData(form);
        const res = await fetch(`/api/public-challenges/${encodeURIComponent(challengeId)}/entries`, {
          method: 'POST',
          body: formData
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Submission failed');

        form.reset();
        setMessage('success', 'Your challenge entry has been submitted successfully. Thank you!');
      } catch (err) {
        setMessage('error', err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Entry';
      }
    }

    loadChallenge();
  </script>
</body>
</html>
